workflows:
  # ============================================================
  # Aura Voice Chat - Debug APK
  # Free-plan friendly: uses Codemagic macOS M2 instance.
  # No release keystore is required.
  # ============================================================
  android-debug:
    name: Aura Voice Chat - Debug APK
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      node: 20
      java: 17
      vars:
        APP_URL: "https://ais-pre-iilcebmw4madl2gy2lpdl6-259473150381.asia-east1.run.app"
        NODE_ENV: "production"
        DISABLE_HMR: "true"

    cache:
      cache_paths:
        - $HOME/.npm
        - $HOME/.gradle/caches
        - $HOME/.gradle/wrapper

    scripts:
      - name: Install Node dependencies
        script: |
          npm install --no-audit --no-fund

      - name: Build web application
        script: |
          npm run build

      - name: Sync Capacitor Android project
        script: |
          npx cap sync android

      - name: Configure Android SDK location
        script: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > "$CM_BUILD_DIR/android/local.properties"

      - name: Make Gradle wrapper executable
        script: |
          chmod +x android/gradlew

      - name: Build debug APK
        script: |
          cd android
          ./gradlew --no-daemon assembleDebug

    artifacts:
      - android/app/build/outputs/apk/debug/*.apk
      - android/app/build/outputs/apk/**/*.apk
      - android/app/build/outputs/logs/**/*.txt


  # ============================================================
  # Aura Voice Chat - Signed Release APK
  # Requires an Android keystore configured in Codemagic with
  # reference name: aura_release_keystore
  # ============================================================
  android-release:
    name: Aura Voice Chat - Signed Release APK
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      node: 20
      java: 17

      android_signing:
        - aura_release_keystore

      vars:
        APP_URL: "https://ais-pre-iilcebmw4madl2gy2lpdl6-259473150381.asia-east1.run.app"
        NODE_ENV: "production"
        DISABLE_HMR: "true"

    cache:
      cache_paths:
        - $HOME/.npm
        - $HOME/.gradle/caches
        - $HOME/.gradle/wrapper

    scripts:
      - name: Install Node dependencies
        script: |
          npm install --no-audit --no-fund

      - name: Build web application
        script: |
          npm run build

      - name: Verify production backend URL
        script: |
          test -n "$APP_URL"
          echo "Using configured production backend: $APP_URL"

      - name: Sync Capacitor Android project
        script: |
          npx cap sync android

      - name: Configure Android SDK location
        script: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > "$CM_BUILD_DIR/android/local.properties"

      - name: Verify Android signing credentials
        script: |
          test -n "$CM_KEYSTORE_PATH"
          test -n "$CM_KEYSTORE_PASSWORD"
          test -n "$CM_KEY_ALIAS"
          test -n "$CM_KEY_PASSWORD"
          echo "Android signing identity is available."

      - name: Make Gradle wrapper executable
        script: |
          chmod +x android/gradlew

      - name: Build signed release APK
        script: |
          export CM_KEYSTORE="$CM_KEYSTORE_PATH"
          cd android
          ./gradlew --no-daemon clean assembleRelease

      - name: Verify release APK
        script: |
          APK="$(find android/app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' | head -n 1)"
          test -n "$APK"
          test -f "$APK"
          echo "Release APK created: $APK"
          ls -lh "$APK"

    artifacts:
      - android/app/build/outputs/apk/release/*.apk
      - android/app/build/outputs/mapping/release/**/*
      - android/app/build/outputs/logs/**/*.txt
