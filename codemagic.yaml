workflows:
  android-release:
    name: Android Release Build
    max_build_duration: 60
    instance_type: linux_x2
    environment:
      node: 22
      java: 21
      groups:
        # Define 'android_credentials' in Codemagic UI (Application > Environment variables)
        # to securely provide: CM_KEYSTORE, CM_KEYSTORE_PASSWORD, CM_KEY_ALIAS, CM_KEY_PASSWORD
        - android_credentials
    scripts:
      - name: Install Node dependencies
        script: |
          npm ci || npm install
      - name: Run web build
        script: |
          npm run build
      - name: Run Capacitor sync
        script: |
          npx cap sync android
      - name: Configure Android SDK location
        script: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > android/local.properties
      - name: Make Gradle wrapper executable
        script: |
          chmod +x android/gradlew
      - name: Build Android release APK
        script: |
          cd android
          ./gradlew assembleRelease
    artifacts:
      - android/app/build/outputs/**/*.apk
